"use strict";(()=>{var Z=[{id:"history-01",category:"history",difficulty:1,question:"훈민정음을 창제한 조선의 왕은?",choices:["태종","세조","성종","세종"],answer_index:3,explanation:"세종은 1443년 훈민정음을 창제하고 1446년에 반포했다.",hint:"이 왕 때 집현전 학자들이 활약했고, 측우기도 만들어졌다."},{id:"history-02",category:"history",difficulty:1,question:"고조선을 건국했다고 전해지는 인물은?",choices:["주몽","온조","단군왕검","박혁거세"],answer_index:2,explanation:"『삼국유사』에는 단군왕검이 고조선을 세웠다고 기록되어 있다.",hint:"『삼국유사』의 건국 신화에서 곰이 변한 웅녀의 아들로 나온다."},{id:"history-03",category:"history",difficulty:1,question:"임진왜란 때 한산도 대첩을 승리로 이끈 장군은?",choices:["권율","이순신","김시민","곽재우"],answer_index:1,explanation:"1592년 이순신은 학익진 전법으로 한산도 앞바다에서 일본 수군을 크게 무찔렀다.",hint:"『난중일기』를 남겼으며, 거북선으로도 유명한 장군이다."},{id:"history-04",category:"history",difficulty:1,question:"1919년 일제에 맞서 전국적으로 일어난 독립 만세 운동은?",choices:["3·1 운동","6·10 만세 운동","광주 학생 항일 운동","4·19 혁명"],answer_index:0,explanation:"3·1 운동은 1919년 3월 1일 시작되어 대한민국 임시 정부 수립의 계기가 되었다.",hint:"운동이 시작된 날짜가 이름에 그대로 들어 있다."},{id:"history-05",category:"history",difficulty:1,question:"고구려를 건국한 인물은?",choices:["온조","대조영","왕건","주몽"],answer_index:3,explanation:"주몽(동명성왕)이 기원전 37년에 고구려를 세웠다고 전해진다.",hint:"부여에서 내려와 나라를 세웠으며, 이름에 활을 잘 쏘는 사람이라는 뜻이 있다고 전해진다."},{id:"history-06",category:"history",difficulty:1,question:"918년 고려를 건국한 인물은?",choices:["궁예","견훤","왕건","이성계"],answer_index:2,explanation:"왕건은 918년 고려를 세우고 936년 후삼국을 통일했다.",hint:"후고구려를 세운 궁예의 신하였다가 왕위에 올랐고, 송악(개경)을 도읍으로 삼았다."},{id:"history-07",category:"history",difficulty:2,question:"1392년 조선을 건국한 인물은?",choices:["정도전","이성계","이방원","최영"],answer_index:1,explanation:"이성계는 위화도 회군 이후 권력을 잡고 1392년 조선을 건국했다.",hint:"위화도 회군을 이끈 장군으로, 새 왕조의 첫 번째 왕이 되었다."},{id:"history-08",category:"history",difficulty:2,question:"나당 전쟁에서 당나라 세력을 몰아내고 삼국 통일을 완성한 신라의 왕은?",choices:["문무왕","무열왕","진흥왕","법흥왕"],answer_index:0,explanation:"문무왕은 676년 기벌포 전투 승리로 당군을 몰아내고 삼국 통일을 완성했다.",hint:"죽어서 용이 되어 나라를 지키겠다며 동해 바다에 묻혔다고 전해진다."},{id:"history-09",category:"history",difficulty:2,question:"698년 발해를 건국한 인물은?",choices:["대무예","궁예","견훤","대조영"],answer_index:3,explanation:"고구려 유민 출신 대조영이 698년 동모산에서 발해를 세웠다.",hint:"고구려 장수 출신으로, 천문령 전투에서 당나라 군대를 물리쳤다."},{id:"history-10",category:"history",difficulty:2,question:"세종 때 장영실이 만든 자동 물시계의 이름은?",choices:["앙부일구","측우기","자격루","혼천의"],answer_index:2,explanation:"자격루는 정해진 시각에 종·북·징이 저절로 울리는 자동 물시계이다.",hint:"흘러드는 물의 양으로 시간을 재고, 인형이 종을 쳐서 시각을 알렸다."},{id:"history-11",category:"history",difficulty:2,question:"백제의 마지막 왕은?",choices:["무령왕","의자왕","성왕","근초고왕"],answer_index:1,explanation:"의자왕 때인 660년 백제는 나당 연합군에 의해 멸망했다.",hint:"계백 장군이 황산벌에서 신라군과 싸운 것이 이 왕 때의 일이다."},{id:"history-12",category:"history",difficulty:2,question:"고려가 몽골의 침입을 부처의 힘으로 물리치고자 새긴 대장경은?",choices:["팔만대장경","초조대장경","직지심체요절","삼국사기"],answer_index:0,explanation:"팔만대장경(재조대장경)은 몽골 침입기에 새겼으며 합천 해인사에 보관되어 있다.",hint:"지금은 합천 해인사 장경판전에 보관되어 있다."},{id:"history-13",category:"history",difficulty:2,question:"1377년 청주 흥덕사에서 금속 활자로 인쇄된 고려의 불교 서적은?",choices:["팔만대장경","삼국유사","동의보감","직지심체요절"],answer_index:3,explanation:"『직지심체요절』은 1377년 청주 흥덕사에서 금속 활자로 인쇄되었으며, 2001년 유네스코 세계 기록 유산에 등재되었다.",hint:"지금은 프랑스 국립 도서관에 소장되어 있다."},{id:"history-14",category:"history",difficulty:2,question:"조선 시대 의학서 『동의보감』을 편찬한 인물은?",choices:["정약용","이황","허준","박지원"],answer_index:2,explanation:"허준은 선조의 명을 받아 『동의보감』을 편찬해 1610년에 완성했다.",hint:"임진왜란 때 피란길에 오른 선조를 끝까지 따른 어의이다."},{id:"history-15",category:"history",difficulty:2,question:"조선의 정조가 수원에 쌓은 성곽은?",choices:["남한산성","수원 화성","행주산성","북한산성"],answer_index:1,explanation:"수원 화성은 정조 때인 1796년 완공되었으며 유네스코 세계 유산이다.",hint:"정약용이 설계에 참여했고, 공사에 거중기가 쓰였다."},{id:"history-16",category:"history",difficulty:2,question:"1876년 조선이 일본과 맺은 최초의 근대적 조약은?",choices:["강화도 조약","을사늑약","제물포 조약","한성 조약"],answer_index:0,explanation:"강화도 조약(조일 수호 조규)은 부산 등 3개 항구 개항을 규정한 불평등 조약이다.",hint:"운요호 사건을 계기로 맺어졌다."},{id:"history-17",category:"history",difficulty:3,question:"고구려 광개토대왕릉비를 세운 왕은?",choices:["소수림왕","고국원왕","미천왕","장수왕"],answer_index:3,explanation:"장수왕은 아버지 광개토대왕의 업적을 기리기 위해 414년 비를 세웠다.",hint:"평양으로 도읍을 옮기고 남진 정책을 펼친 왕이다."},{id:"history-18",category:"history",difficulty:3,question:"이차돈의 순교를 계기로 신라에서 불교를 공인한 왕은?",choices:["진흥왕","지증왕","법흥왕","내물왕"],answer_index:2,explanation:"법흥왕은 527년 이차돈의 순교를 계기로 불교를 공인했다.",hint:"율령을 반포하고 '건원'이라는 연호를 처음 사용한 왕이다."},{id:"history-19",category:"history",difficulty:3,question:"고려 광종이 억울하게 노비가 된 사람을 양인으로 되돌리기 위해 실시한 법은?",choices:["과거제","노비안검법","전시과","기인 제도"],answer_index:1,explanation:"광종은 956년 노비안검법을 실시해 호족 세력을 약화시켰다.",hint:"이 정책으로 호족이 거느린 노비가 줄어 호족의 경제력과 군사력이 약해졌다."},{id:"history-20",category:"history",difficulty:3,question:"조선의 기본 법전인 『경국대전』을 완성·반포한 왕은?",choices:["성종","세조","태종","영조"],answer_index:0,explanation:"『경국대전』은 세조 때 편찬을 시작해 성종 때인 1485년에 완성·반포되었다.",hint:"홍문관을 설치하고 『국조오례의』를 펴낸 왕이다."},{id:"science-01",category:"science",difficulty:1,question:"물의 화학식은?",choices:["CO₂","O₂","NaCl","H₂O"],answer_index:3,explanation:"물 분자는 수소 원자 2개와 산소 원자 1개로 이루어져 있다.",hint:"두 종류의 원소로 이루어져 있고, 그중 하나는 산소이다."},{id:"science-02",category:"science",difficulty:1,question:"태양계에서 태양에 가장 가까운 행성은?",choices:["금성","화성","수성","지구"],answer_index:2,explanation:"수성은 태양에서 가장 가까운 첫 번째 행성이다.",hint:"태양계에서 가장 작은 행성이기도 하다."},{id:"science-03",category:"science",difficulty:1,question:"식물이 빛 에너지를 이용해 양분을 만드는 과정은?",choices:["호흡","광합성","증산 작용","발효"],answer_index:1,explanation:"광합성은 빛 에너지로 이산화탄소와 물에서 포도당과 산소를 만드는 과정이다.",hint:"주로 잎의 엽록체에서 일어난다."},{id:"science-04",category:"science",difficulty:1,question:"사람의 몸에서 혈액을 온몸으로 내보내는 기관은?",choices:["심장","폐","간","콩팥"],answer_index:0,explanation:"심장은 수축과 이완을 반복하며 혈액을 온몸으로 순환시킨다.",hint:"가슴 한가운데에서 약간 왼쪽에 있으며, 쉬지 않고 뛴다."},{id:"science-05",category:"science",difficulty:1,question:"1기압에서 물이 끓는 온도는 섭씨 몇 도인가?",choices:["90°C","80°C","120°C","100°C"],answer_index:3,explanation:"1기압에서 순수한 물의 끓는점은 약 100°C이다.",hint:"섭씨 눈금은 물이 어는 온도를 0으로, 이 온도를 눈금의 다른 기준점으로 삼았다."},{id:"science-06",category:"science",difficulty:1,question:"태양계에서 지름이 가장 큰 행성은?",choices:["토성","해왕성","목성","천왕성"],answer_index:2,explanation:"목성은 지름이 지구의 약 11배로 태양계에서 가장 큰 행성이다.",hint:"대적점이라는 거대한 소용돌이가 있는 행성이다."},{id:"science-07",category:"science",difficulty:2,question:"원소 기호 'Fe'가 나타내는 원소는?",choices:["불소","철","납","금"],answer_index:1,explanation:"Fe는 철을 뜻하는 라틴어 'ferrum'에서 유래했다.",hint:"자석에 잘 붙는 금속이다."},{id:"science-08",category:"science",difficulty:2,question:"진공에서 빛의 속력은 초속 약 몇 km인가?",choices:["약 30만 km","약 3만 km","약 300만 km","약 3천 km"],answer_index:0,explanation:"진공에서 빛의 속력은 초속 약 299,792 km이다.",hint:"빛은 1초에 지구 둘레(약 4만 km)를 약 7바퀴 반 돌 수 있다."},{id:"science-09",category:"science",difficulty:2,question:"지구 대기에서 가장 많은 비율을 차지하는 기체는?",choices:["산소","아르곤","이산화탄소","질소"],answer_index:3,explanation:"건조한 공기의 약 78%는 질소, 약 21%는 산소이다.",hint:"과자 봉지를 채우는 데에도 쓰이는 기체이다."},{id:"science-10",category:"science",difficulty:2,question:"1953년 DNA의 이중 나선 구조를 발표한 과학자들은?",choices:["멘델과 다윈","퀴리 부부","왓슨과 크릭","파스퇴르와 코흐"],answer_index:2,explanation:"왓슨과 크릭은 1953년 학술지 『네이처』에 DNA 이중 나선 모형을 발표했다.",hint:"1962년 윌킨스와 함께 노벨 생리의학상을 받은 두 사람이다."},{id:"science-11",category:"science",difficulty:2,question:"만유인력의 법칙을 정리한 과학자는?",choices:["갈릴레이","뉴턴","아인슈타인","케플러"],answer_index:1,explanation:"뉴턴은 1687년 『프린키피아』에서 만유인력의 법칙을 발표했다.",hint:"떨어지는 사과 일화로 유명한 영국의 과학자이다."},{id:"science-12",category:"science",difficulty:2,question:"25°C에서 중성인 물의 pH 값은?",choices:["7","0","1","14"],answer_index:0,explanation:"25°C에서 pH 7은 중성이며, 7보다 작으면 산성, 크면 염기성이다.",hint:"흔히 0~14로 나타내는 pH 눈금에서 산성과 염기성의 경계에 있는 값이다."},{id:"science-13",category:"science",difficulty:2,question:"다음 중 소리가 전달될 수 없는 곳은?",choices:["물","철","공기","진공"],answer_index:3,explanation:"소리는 매질의 진동으로 전달되므로 매질이 없는 진공에서는 전달되지 않는다.",hint:"우주 공간에서는 폭발이 일어나도 소리가 들리지 않는다."},{id:"science-14",category:"science",difficulty:2,question:"적혈구가 산소를 운반할 수 있게 해 주는 단백질은?",choices:["인슐린","케라틴","헤모글로빈","아밀레이스"],answer_index:2,explanation:"헤모글로빈은 철을 포함한 단백질로 산소와 결합해 온몸으로 운반한다.",hint:"이 단백질 때문에 혈액이 붉은색을 띤다."},{id:"science-15",category:"science",difficulty:2,question:"주기율표에서 원자 번호 1번인 원소는?",choices:["헬륨","수소","산소","탄소"],answer_index:1,explanation:"수소는 양성자 1개를 가진 가장 가벼운 원소이다.",hint:"우주에서 가장 흔한 원소이며, 물을 이루는 원소 중 하나이다."},{id:"science-16",category:"science",difficulty:2,question:"전기 저항의 단위는?",choices:["옴(Ω)","볼트(V)","암페어(A)","와트(W)"],answer_index:0,explanation:"옴은 저항, 볼트는 전압, 암페어는 전류, 와트는 전력의 단위이다.",hint:"단위 기호는 그리스 문자 오메가이다."},{id:"science-17",category:"science",difficulty:3,question:"절대 영도(0 K)는 섭씨 몇 도인가?",choices:["−100°C","−373.15°C","−459.67°C","−273.15°C"],answer_index:3,explanation:"절대 영도는 −273.15°C이며, −459.67은 화씨로 나타낸 값이다.",hint:"섭씨온도에 273.15를 더하면 켈빈 온도가 된다."},{id:"science-18",category:"science",difficulty:3,question:"세포에서 ATP를 주로 생산해 '세포의 발전소'라 불리는 소기관은?",choices:["리보솜","골지체","미토콘드리아","리소좀"],answer_index:2,explanation:"미토콘드리아는 세포 호흡을 통해 ATP 형태로 에너지를 만든다.",hint:"자신만의 DNA를 가지고 있으며, 대개 어머니에게서만 물려받는다."},{id:"science-19",category:"science",difficulty:3,question:"물질 1몰에 들어 있는 입자 수(아보가드로 수)는 약 얼마인가?",choices:["3.00×10⁸","6.02×10²³","9.81×10⁰","1.60×10⁻¹⁹"],answer_index:1,explanation:"아보가드로 수는 약 6.022×10²³이며, 1몰에 들어 있는 입자의 수이다.",hint:"탄소-12 원자 12 g에 들어 있는 원자 수와 거의 같다."},{id:"science-20",category:"science",difficulty:3,question:"멘델이 유전 법칙을 밝히는 실험에 사용한 식물은?",choices:["완두","옥수수","벼","강낭콩"],answer_index:0,explanation:"멘델은 완두를 교배하는 실험으로 우열의 원리와 분리 법칙 등을 밝혔다.",hint:"멘델은 이 식물의 씨 모양(둥근 것과 주름진 것)과 색(노란색과 초록색)을 관찰했다."},{id:"geography-01",category:"geography",difficulty:1,question:"대한민국의 수도는?",choices:["부산","인천","대구","서울"],answer_index:3,explanation:"서울은 조선 시대부터 이어져 온 대한민국의 수도이다.",hint:"한강이 도시 한가운데를 가로질러 흐른다."},{id:"geography-02",category:"geography",difficulty:1,question:"세계에서 가장 넓은 대양은?",choices:["대서양","인도양","태평양","북극해"],answer_index:2,explanation:"태평양은 지구 표면의 약 3분의 1을 차지하는 가장 넓은 대양이다.",hint:"마젤란이 '평화로운 바다'라는 뜻으로 이름을 붙였다."},{id:"geography-03",category:"geography",difficulty:1,question:"일본의 수도는?",choices:["오사카","도쿄","교토","나고야"],answer_index:1,explanation:"도쿄는 일본의 수도이며, 교토는 메이지 유신 이전의 옛 수도이다.",hint:"에도 시대에는 '에도'라고 불렸다."},{id:"geography-04",category:"geography",difficulty:1,question:"피라미드로 유명한 기자(Giza)가 있는 나라는?",choices:["이집트","멕시코","페루","그리스"],answer_index:0,explanation:"기자의 대피라미드는 이집트 카이로 근교에 있다.",hint:"나일강이 국토를 남북으로 가로질러 흐른다."},{id:"geography-05",category:"geography",difficulty:1,question:"남한에서 해발 고도가 가장 높은 산은?",choices:["지리산","설악산","태백산","한라산"],answer_index:3,explanation:"제주도의 한라산은 해발 약 1,950 m로 남한에서 가장 높은 산이다.",hint:"정상에 백록담이라는 화구호가 있다."},{id:"geography-06",category:"geography",difficulty:1,question:"대한민국에서 면적이 가장 넓은 섬은?",choices:["거제도","진도","제주도","강화도"],answer_index:2,explanation:"제주도는 면적 약 1,800 km²로 우리나라에서 가장 큰 섬이다.",hint:"돌, 바람, 여자가 많다고 해서 '삼다도'라고도 불린다."},{id:"geography-07",category:"geography",difficulty:2,question:"세계에서 면적이 가장 넓은 나라는?",choices:["캐나다","러시아","중국","미국"],answer_index:1,explanation:"러시아의 면적은 약 1,700만 km²로 두 번째인 캐나다보다 훨씬 넓다.",hint:"국토가 동유럽에서 북아시아까지 걸쳐 있으며, 시베리아가 이 나라에 속한다."},{id:"geography-08",category:"geography",difficulty:2,question:"오스트레일리아의 수도는?",choices:["캔버라","시드니","멜버른","퍼스"],answer_index:0,explanation:"캔버라는 시드니와 멜버른 사이에 수도로 계획해 세운 도시이다.",hint:"1913년부터 수도로 계획해 건설한 도시로, 미국 건축가 그리핀 부부의 설계안을 바탕으로 지어졌다."},{id:"geography-09",category:"geography",difficulty:2,question:"극지방을 제외하고 세계에서 가장 넓은 사막은?",choices:["고비 사막","아라비아 사막","칼라하리 사막","사하라 사막"],answer_index:3,explanation:"아프리카 북부의 사하라 사막은 극지를 제외하면 세계에서 가장 넓은 사막이다.",hint:"아프리카 대륙 북부에 펼쳐져 있다."},{id:"geography-10",category:"geography",difficulty:2,question:"남아메리카 대륙 서쪽을 따라 길게 뻗은 산맥은?",choices:["로키산맥","알프스산맥","안데스산맥","히말라야산맥"],answer_index:2,explanation:"안데스산맥은 약 7,000 km에 이르는 세계에서 가장 긴 육상 산맥이다.",hint:"칠레와 아르헨티나의 국경을 따라 뻗어 있다."},{id:"geography-11",category:"geography",difficulty:2,question:"캐나다의 수도는?",choices:["토론토","오타와","밴쿠버","몬트리올"],answer_index:1,explanation:"캐나다의 수도는 온타리오주의 오타와이다.",hint:"온타리오주에 있으며, 퀘벡주와의 경계에 가까운 도시이다."},{id:"geography-12",category:"geography",difficulty:2,question:"해발 고도가 세계에서 가장 높은 산은?",choices:["에베레스트산","K2","킬리만자로산","몽블랑"],answer_index:0,explanation:"히말라야산맥의 에베레스트산은 해발 약 8,849 m로 세계에서 가장 높다.",hint:"네팔과 중국(티베트)의 국경에 있다."},{id:"geography-13",category:"geography",difficulty:2,question:"지중해와 홍해를 잇는 운하는?",choices:["파나마 운하","킬 운하","코린트 운하","수에즈 운하"],answer_index:3,explanation:"이집트의 수에즈 운하는 1869년 개통되어 아시아와 유럽 간 항로를 크게 줄였다.",hint:"이집트의 시나이반도 서쪽에 있다."},{id:"geography-14",category:"geography",difficulty:2,question:"영국 런던 시내를 가로질러 흐르는 강은?",choices:["센강","라인강","템스강","도나우강"],answer_index:2,explanation:"템스강은 런던을 지나 북해로 흐르며, 센강은 파리를 흐른다.",hint:"강가에 영국 국회의사당과 빅벤이 있다."},{id:"geography-15",category:"geography",difficulty:2,question:"브라질에서 공용어로 쓰는 언어는?",choices:["스페인어","포르투갈어","영어","프랑스어"],answer_index:1,explanation:"브라질은 포르투갈의 식민지였던 역사 때문에 포르투갈어를 쓴다.",hint:"남아메리카의 다른 많은 나라와 달리 스페인어를 공용어로 쓰지 않는다."},{id:"geography-16",category:"geography",difficulty:2,question:"이탈리아 로마 시내에 있는, 면적이 세계에서 가장 작은 나라는?",choices:["바티칸 시국","산마리노","모나코","리히텐슈타인"],answer_index:0,explanation:"바티칸 시국은 면적 약 0.44 km²로 세계에서 가장 작은 나라이다.",hint:"교황이 다스리는 나라로, 성 베드로 대성당이 있다."},{id:"geography-17",category:"geography",difficulty:3,question:"한반도에서 가장 긴 강은?",choices:["낙동강","두만강","한강","압록강"],answer_index:3,explanation:"압록강은 길이 약 800 km로 한반도에서 가장 길며, 남한에서는 낙동강이 가장 길다.",hint:"북한과 중국의 국경을 이루며 서해(황해)로 흘러든다."},{id:"geography-18",category:"geography",difficulty:3,question:"세계에서 가장 깊은 해구는?",choices:["통가 해구","일본 해구","마리아나 해구","푸에르토리코 해구"],answer_index:2,explanation:"서태평양의 마리아나 해구는 가장 깊은 곳이 약 11,000 m에 이른다.",hint:"가장 깊은 지점은 '챌린저 해연'이라고 불린다."},{id:"geography-19",category:"geography",difficulty:3,question:"아프리카 대륙에서 해발 고도가 가장 높은 산은?",choices:["케냐산","킬리만자로산","몽블랑","엘브루스산"],answer_index:1,explanation:"탄자니아의 킬리만자로산은 해발 약 5,895 m로 아프리카에서 가장 높다.",hint:"탄자니아 북동부에 있는 화산이다."},{id:"geography-20",category:"geography",difficulty:3,question:"튀르키예의 수도는?",choices:["앙카라","이스탄불","이즈미르","안탈리아"],answer_index:0,explanation:"튀르키예의 수도는 앙카라이며, 이스탄불은 오스만 제국의 수도였다.",hint:"튀르키예 공화국을 세운 무스타파 케말(아타튀르크)이 1923년에 수도로 정했다."},{id:"general-01",category:"general",difficulty:1,question:"윤년이 아닌 해의 1년은 며칠인가?",choices:["360일","366일","364일","365일"],answer_index:3,explanation:"평년은 365일이고, 윤년에는 2월 29일이 더해져 366일이 된다.",hint:"1년은 52주에 하루가 더해진 길이이다."},{id:"general-02",category:"general",difficulty:1,question:"무지개의 일곱 색깔 중 빨강 바로 다음 색은?",choices:["노랑","초록","주황","파랑"],answer_index:2,explanation:"무지개 색은 빨강, 주황, 노랑, 초록, 파랑, 남색, 보라 순이다.",hint:"빨강과 노랑을 섞으면 나오는 색이다."},{id:"general-03",category:"general",difficulty:1,question:"축구 경기를 시작할 때 한 팀이 경기장에 내보내는 선수는 몇 명인가?",choices:["9명","11명","10명","12명"],answer_index:1,explanation:"축구는 골키퍼 1명을 포함해 한 팀 11명이 경기한다.",hint:"야구(9명)보다 많고 럭비 유니언(15명)보다 적다."},{id:"general-04",category:"general",difficulty:1,question:"올림픽 오륜기에 그려진 고리는 몇 개인가?",choices:["5개","4개","6개","7개"],answer_index:0,explanation:"오륜기의 다섯 고리는 다섯 대륙의 화합을 상징한다.",hint:"고리의 색은 파랑, 노랑, 검정, 초록, 빨강이다."},{id:"general-05",category:"general",difficulty:1,question:"한글 자음 'ㄱ'의 이름은?",choices:["기윽","니은","키읔","기역"],answer_index:3,explanation:"'ㄱ'의 이름은 '기역', 'ㄴ'은 '니은', 'ㅋ'은 '키읔'이다.",hint:"『훈몽자회』에서 '윽'에 맞는 한자가 없어 다른 한자를 빌려 쓴 이름이 굳어졌다."},{id:"general-06",category:"general",difficulty:1,question:"1시간은 몇 초인가?",choices:["360초","6,000초","3,600초","1,200초"],answer_index:2,explanation:"1시간은 60분이고 1분은 60초이므로 60×60=3,600초이다.",hint:"1분은 60초이고, 1시간은 60분이다."},{id:"general-07",category:"general",difficulty:2,question:"다음 중 셰익스피어의 4대 비극이 아닌 작품은?",choices:["햄릿","로미오와 줄리엣","오셀로","맥베스"],answer_index:1,explanation:"셰익스피어의 4대 비극은 『햄릿』, 『오셀로』, 『맥베스』, 『리어왕』이다.",hint:"4대 비극에는 『리어왕』이 들어간다."},{id:"general-08",category:"general",difficulty:2,question:"그림 「모나리자」를 그린 화가는?",choices:["레오나르도 다빈치","미켈란젤로","라파엘로","렘브란트"],answer_index:0,explanation:"「모나리자」는 레오나르도 다빈치가 16세기 초에 그린 초상화이다.",hint:"「최후의 만찬」을 그린 화가이기도 하다."},{id:"general-09",category:"general",difficulty:2,question:"베토벤 교향곡 제9번에 붙은 별칭은?",choices:["운명","영웅","전원","합창"],answer_index:3,explanation:"베토벤 교향곡 3번은 「영웅」, 5번은 「운명」, 6번은 「전원」, 9번은 「합창」이다.",hint:"4악장에서 성악가들이 실러의 시 「환희의 송가」를 노래한다."},{id:"general-10",category:"general",difficulty:2,question:"정식 대국에 쓰는 표준 바둑판은 가로·세로 각각 몇 줄로 이루어져 있는가?",choices:["15줄","17줄","19줄","21줄"],answer_index:2,explanation:"표준 바둑판은 가로·세로 19줄로 361개의 교차점이 있다.",hint:"바둑판의 교차점은 모두 361개이다."},{id:"general-11",category:"general",difficulty:2,question:"체스를 시작할 때 한 사람이 가지는 말은 몇 개인가?",choices:["12개","16
